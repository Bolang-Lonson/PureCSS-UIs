<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="top">
            <h1 class="logo">Logo</h1>
            <i class="bi bi-grid-fill"></i>
        </div>
        <div class="sidebar">
            <div class="separator-line"></div>
            <div class="center">
                <div class="link">
                    <i class="bi bi-speedometer link_icon"></i>
                    <p>Dashboard</p>
                </div>
                <div class="link">
                    <i class="bi bi-card-text link_icon"></i>
                    <p>Messages</p>
                </div>
                <div class="link">
                    <i class="bi bi-person-plus-fill link_icon"></i>
                    <p>Following</p>
                </div>
                <div class="link">
                    <i class="bi bi-people-fill link_icon"></i>
                    <p>Team</p>
                </div>
                <div class="link searchbar">
                    <i class="bi bi-search link_icon"></i>
                    <input type="search" placeholder="Search"/>
                </div>
            </div>
            <div class="separator-line"></div>
            <div class="bottom">
                <button>Logout</button>
                <button>Settings</button>
                <div class="profile_stuff">
                    <img src="images/BolangPic.jpg" alt="profile pic" class="profile">
                    <p class="name">Bolang-Lonson</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
